<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GraphiQL</title>
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/graphiql@2.4.7/graphiql.min.css"
    />
    <style>
        html, body, #graphiql {
            height: 100%;
            margin: 0;
            width: 100%;
            overflow: hidden;
        }
    </style>
</head>
<body>
<div id="graphiql">Loading...</div>

<script src="https://cdn.jsdelivr.net/npm/react@17.0.2/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@17.0.2/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/graphiql@2.4.7/graphiql.min.js"></script>

<script>
    const fetcher = async (graphQLParams) => {
        const response = await fetch(window.location.origin + '/GraphQlLogement_war_exploded/graphql', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(graphQLParams)
        });
        return response.json();
    };

    ReactDOM.render(
        React.createElement(GraphiQL, {
            fetcher: fetcher,
            defaultQuery: `{
  allUEs {
    code
    domaine
    responsable
    credits
    semestre
  }
}`
        }),
        document.getElementById('graphiql')
    );
</script>
</body>
</html>
